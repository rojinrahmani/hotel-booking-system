services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
