[project]
name = "hotel-booking-system"
version = "0.1.0"
description = "Hotel room booking REST API built with Django REST Framework and PostgreSQL"
readme = "README.md"
authors = [
    { name = "Rojin", email = "rahmanirojin98@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "DJ", "SIM", "RUF"]
ignore = [
    "RUF012", # false positive on Django and DRF `Meta` and class attributes
]
